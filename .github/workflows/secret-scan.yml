name: Secret scan

# Fails the check when a commit contains a secret.
# pull_request scans the commits introduced by the pull request (base..head).
# push to main scans the full history of the checked-out ref.
#
# The scanner is the open-source gitleaks binary, pinned by version and the
# SHA-256 of the release tarball. gitleaks/gitleaks-action requires a
# GITLEAKS_LICENSE secret on organization-owned repositories and exits before
# scanning when that secret is absent. This repository is owned by
# drive-brand-growth, so the binary is what actually runs the scan.
# A .gitleaks.toml at the repo root is picked up automatically if one is added.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          # sha256 of gitleaks_8.30.1_linux_x64.tar.gz from the v8.30.1 release.
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o "${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            if ! [[ "${BASE_SHA}" =~ ^[0-9a-fA-F]{40}$ && "${HEAD_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::pull request base or head SHA is missing"
              exit 1
            fi
            git rev-parse --verify --quiet "${BASE_SHA}^{commit}" >/dev/null
            git rev-parse --verify --quiet "${HEAD_SHA}^{commit}" >/dev/null
            # Commits the pull request introduces, including a secret added
            # and removed before the final diff.
            gitleaks git . \
              --redact \
              --no-banner \
              --no-color \
              --verbose \
              --exit-code 1 \
              --log-opts="${BASE_SHA}..${HEAD_SHA}"
          else
            gitleaks git . \
              --redact \
              --no-banner \
              --no-color \
              --verbose \
              --exit-code 1
          fi
