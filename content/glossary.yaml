status: published
title: Glossary
description: >
  Closed circuit, open circuit, short circuit, and owner load, plus the five stages
  of The Circuit Method™ in plain operator language.
kicker: Shared language
lede: >
  Each word is one plain idea. DMN means written decision rules. Bayesian means
  updating your odds as evidence comes in. Causal means proving what actually
  caused the result.
