sections:
  - heading: Information we collect
    paragraphs:
      - >
        If you email us, we receive the address you wrote from and whatever you put
        in the message. A Pipeline Autopsy starts as an email with a pipeline
        export. This site does not take a file upload.
      - >
        Analytics runs only when a measurement id is configured for the deployment.
        When it is, Google Analytics may receive page views, session length, and a
        general location. When it is not configured, that script is not loaded.
