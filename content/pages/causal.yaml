title: Causal proof
path: /causal
description: >
  Attribution after the result: credit says what was nearby, cause asks what
  changed the outcome. Four questions for the review, and a refusal when the
  case is not shown.
status: published
kicker: Proof of cause
headline: Attribution asks what moved the result
updated: ""
lede:
  - >
    After the period closes, a report will offer credit. Credit answers which
    touch was nearby when the deal moved. Cause answers which activity changed
    the outcome. A forecast review that treats those as the same question will
    coach the wrong work.
table:
  caption: ""
  columns: []
  rows: []
sections:
  - heading: The trap in a normal pipeline
    paragraphs:
      - >
        Accounts already likely to buy get more meetings and more notes. Those
        touches are present when the opportunity closes. The report gives the
        touches the credit. The readiness was doing much of the work. The team
        did not cheat. The page answered the easier question.
    items: []
    listStyle: none
    callout: ""
    embed: none
  - heading: Four demands, before anyone states a lift
    paragraphs: []
    items:
      - label: ""
        text: A baseline. What happens for a comparable account when this activity does not occur. No baseline, no claim.
        href: ""
      - label: ""
        text: The confounders, named. The things that drive both the activity and the result. Stage, source, and intent that was already there are the place to start.
        href: ""
      - label: ""
        text: An interval. A single figure with no uncertainty is a slogan in a pipeline review.
        href: ""
      - label: ""
        text: A refusal. If the case is not shown, the page says pending. It does not fill the gap with a round number.
        href: ""
    listStyle: numbers
    callout: ""
    embed: none
  - heading: Ask these in the meeting
    paragraphs: []
    items:
      - label: ""
        text: How do we separate cause from a touch that was merely present?
        href: ""
      - label: ""
        text: What baseline is this claim measured against, and where is that baseline kept?
        href: ""
      - label: ""
        text: Where is the uncertainty on this figure?
        href: ""
      - label: ""
        text: What does the report do when the case is not proven? Does it refuse, or does it still print a number?
        href: ""
    listStyle: bullets
    callout: ""
    embed: none
  - heading: What a model is for
    paragraphs:
      - >
        A model can draft the narrative under a chart and list the touches that
        were present. It cannot promote a nearby touch into a cause. The model
        drafts. The owner decides. You decide what is allowed to be said when the
        review asks what worked.
      - >
        The playground does not prove cause. It lets you watch odds move when a
        simulated signal fires. That is forecasting practice. Cause is tested at
        ground, on outcomes, with a baseline you can point to.
