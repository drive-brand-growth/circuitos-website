headline: Bring one meeting you already run.
updated: ""
lede:
  - >
    If you want a second set of eyes on your own loop, write to Noel. A useful
    conversation looks at one motion: the pipeline review, the forecast call,
    lead routing, or the approval before something reaches a customer.
  - >
    The aim of that hour is to name the short circuits and to decide what gets
    written down first. Not to tour a tool, and not to leave with a price.
