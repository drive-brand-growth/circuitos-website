sections:
  - heading: One loop
    paragraphs:
      - The model drafts. The owner decides.
      - >
        A model is a tool inside the method. It can list what came in. It can
        draft the note. It does not own the rule, the odds, or the send.
    items: []
    listStyle: none
    callout: ""
    embed: steps
  - heading: Four words
    paragraphs:
      - A closed circuit is the full loop. The result came back and got scored.
      - An open circuit is built, and not yet proved.
      - A short circuit skips a gate. The usual skip is sending the draft.
      - >
        Owner load is the minutes a day this takes from you. The aim is a small
        load, with the call still yours. This site does not invent that number.
    items: []
    listStyle: none
    callout: ""
    embed: terms
