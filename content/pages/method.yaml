  - heading: Words the loop uses
    paragraphs:
      - Four terms show up everywhere else on this site. The glossary holds the full set.
      - >
        Owner load is the minutes a day the system takes from you. The aim is a small
        load, with the call still yours. This site does not invent a minute count for
        your shop.
