title: The method
path: /method
description: >
  The Circuit Method™ is the loop behind a pipeline review, a forecast call,
  lead routing, an approval, and the attribution question. Five stages, one circuit.
status: published
kicker: Overview
headline: The work you already run, written so it can be repeated
updated: ""
lede:
  - >
    A pipeline review already has a shape. A deal is stuck. Someone says what should
    happen next. A number gets said on the forecast call. A note might go to the buyer.
    Later, someone asks which activity deserved the credit.
  - >
    The Circuit Method™ makes that shape explicit, so it still runs when you are not
    the person in the room. The motions are lead routing, the forecast call, the
    approval before anything reaches a customer or moves money, and the attribution
    question after the result.
