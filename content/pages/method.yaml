  - heading: What the score shows
    paragraphs:
      - >
        Same inputs always give the same score. The score shows the touches
        that counted, the pace against deals that closed, and what the win is
        worth. The Switch reads that score and the written rule, then routes
        the lead. The agent may draft the note that follows. The rule still
        decides.
      - >
        [Noel to confirm: how attribution, velocity, and impact are weighed, and the formula that joins them.]
      - >
        [Noel to confirm: one real lead, with the real inputs and the real Tiebreaker score. No number until you write it.]
    items: []
