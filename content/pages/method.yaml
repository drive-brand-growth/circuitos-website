headline: The odds are math, not mood.
updated: ""
lede:
  - The agent drafts. The rules decide. The odds are math, not mood.
  - >
    Written rules and fixed scores, joined to an agent that only drafts, make
    a revenue system reliable. You write the rules. You still close the switch.
  - >
    Deterministic means the same inputs always give the same result.
    Probabilistic means the agent works from odds. The agent may draft. It
    does not get to change the rule or the score.
