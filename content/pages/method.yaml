sections:
  - heading: The Tiebreaker
    paragraphs:
      - >
        The Tiebreaker is a score. The Switch reads it when a lead needs a
        route.
      - >
        It is not the Breaker. The Breaker is a person. That person says yes
        before anything reaches a customer or moves money. The Tiebreaker never
        sends the note. It only scores the lead so a written rule can route it.
      - >
        The Tiebreaker is Bayesian and deterministic. Bayesian means updating
        your odds as evidence comes in. Deterministic means the same inputs
        always give the same score. Every score shows why.
      - Three inputs go in. Noel writes the weights. This page does not invent them.
    items:
      - label: ""
        text: Attribution. Which touches moved the lead. Nearby is not enough. Causal means proving what actually caused the result.
        href: ""
      - label: ""
        text: Velocity. How fast the lead moves, set next to deals that closed.
