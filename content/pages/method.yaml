  - heading: One loop
    paragraphs:
      - The model drafts. The owner decides.
      - >
        Something comes in. You write the decision and the odds. The work is a
        draft. A person approves what reaches a customer or moves money. The
        result comes back, and you ask what caused it.
    items: []
