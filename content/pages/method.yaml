title: The method
path: /method
description: >
  The Circuit Method™ is five stages and one circuit. Write the decision, say
  the odds, and prove what caused the result.
status: published
kicker: The method
headline: Five stages. One circuit.
updated: ""
lede:
  - >
    The Circuit Method™ is how revenue work gets written down, so it still runs
    when you are not in the room.
  - >
    Something comes in. You write the decision and the odds. The work is a draft.
    A person approves what reaches a customer or moves money. The result comes
    back, and you ask what caused it.
