title: Proof in progress
path: /proof
description: >
  No public results are published here yet. This page explains how results
  will be scored in public: stated odds, a Brier score against a baseline, and
  effect measured on held out data.
status: published
kicker: Proof
headline: Proof in progress.
updated: ""
lede:
  - >
    There are no public results on this site yet. This page says so plainly,
    and it shows how a result will be scored before one is shown.
  - >
    The method asks you to write the rule, state the odds, and prove the cause.
    The same three tests apply to the method itself.
table:
  caption: ""
  columns: []
