proofTitle: Recorded. Measured. Proven.
proofBody: >
  You can read the rule. You can score the odds you wrote. You can see who
  approved the send. That is the proof on this site today.

  [Noel to confirm: one true story of a forecast that was a guess, with the real
  detail and no invented number.]

