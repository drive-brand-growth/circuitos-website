status: published
kicker: The Circuit Method
headline: The agent drafts. The rules decide.
intro: >
  I build revenue systems that tell the truth about the pipeline. You write the decision. You say the odds. You
  keep a record of what caused the result. An agent may draft the note. It does
  not own the rule.
villainTitle: What I teach
villainBody: >
  A course through the five stages. A book a team can use when I am not in the
  room. Strategy work on the pipeline review, the forecast call, routing, and
  approvals.
originTitle: The work behind it
originBody: >
  I have spent more than twenty years in RevOps and sales leadership.

  [Noel to tell: the real moment, the call, the meeting or the deal]

  I wrote the method down so a team can repeat it.
revealTitle: Five stages. One circuit.
exampleTitle: One lead, one pass
exampleLede: >
  A new lead comes in. Signal names what arrived. Switch applies the written
  rule and the odds. Current is the draft. Breaker is written gates plus a
  named person's recorded approval. Ground brings the result back and asks
  what caused it.
diagramTitle: One circuit
diagramLine: signal returns to ground
coreSupport: >
