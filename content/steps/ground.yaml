name: Ground
order: 5
status: published
accent: false
kicker: After the result
line: The outcome comes back
summary: >
  Ground is the return path. The outcome comes back, the forecast call is scored,
  and attribution asks what actually moved the result.
lede:
  - >
    The quarter ends, or the opportunity does. Something happened, or it did not.
    Ground is bringing that fact back to the call you made.
  - >
    Two questions sit here, and they are different. Did the forecast match what
    happened, over many calls and not one hero deal? And what actually moved the
    result, as opposed to what was merely nearby when it happened?
sections:
  - heading: Score the forecast you stated
    paragraphs:
      - >
        Honest odds are a set. The calls you labeled with a similar confidence should
        land at a similar rate. One win does not prove the forecast call. One loss
        does not damn it. If you never bring the outcomes back, you have an open
        circuit: the loop was built, and it was not proved.
      - A closed circuit is the full loop. Signal, switch, current, breaker, and this return.
    bullets: []
  - heading: Then ask the attribution question
    paragraphs:
      - >
        Credit on a dashboard gives a touch a share because the touch was present.
        Cause asks what changed the outcome against a baseline. The accounts already
        likely to buy often get more meetings and more notes. Those touches are
        present at the close. Presence is not the cause.
      - >
        A model may draft the narrative around the report. It may not turn a nearby
        touch into a cause. You decide what is allowed to be said at the next review.
        The proof page is that discipline in full.
    bullets: []
caution: >
  The short circuit at ground is celebrating the touch that was nearest the win,
  and never scoring the odds you stated. The loop looks closed. It is not.
nextHref: /causal
nextLabel: Causal proof
