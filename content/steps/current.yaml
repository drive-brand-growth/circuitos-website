name: Current
order: 3
status: published
accent: false
kicker: The work after the call
line: The work, as a draft
summary: >
  Current is the work that flows from a decision: the note, the task, the forecast
  edit, the routing tag. It runs as a draft until a person releases it.
lede:
  - >
    Once the route is chosen, work wants to move. A note to the buyer. A task for
    the person who owns the account. A change to the number you will say on the
    forecast call. A tag that sends the opportunity to a different queue.
  - Current is that work, still a draft. It has not reached the customer. It has not moved money.
sections:
  - heading: Drafts the team can actually use
    paragraphs:
      - >
        You decide which kinds of work may be prepared. A model can assemble the
        draft from the rule that matched and the signals on the account. The draft
        names the row. It does not send itself.
      - >
        In the pipeline review, current is the stack of prepared work. The conversation
        is whether to release it, not whether to invent it from scratch while the
        meeting runs long.
    bullets: []
  - heading: Fluent is not the same as released
    paragraphs:
      - >
        A clean paragraph is not an approval. The owner load is the minutes this
        stack asks of you. The aim is a small load, with the release still in your
        hands. This site will not pretend to know how many minutes that is in your shop.
    bullets: []
caution: The short circuit is sending the draft because it sounded finished. Current skipped the breaker.
nextHref: /method/breaker
