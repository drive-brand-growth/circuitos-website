name: Switch
order: 2
status: published
accent: true
kicker: The routing rule and the forecast call
line: The decision, written, with odds
summary: >
  Switch is the decision. You write it as rules a pipeline review can read. Each
  rule carries the odds you would say on the forecast call. You close the switch.
lede:
  - >
    Lead routing is a decision whether or not you have written it down. So is the
    line between "hold this deal" and "advance it" on a forecast call.
  - >
    Switch is that decision, written as rules. The writing standard is DMN, Decision
    Model and Notation: a table a person can read, and a system can follow without
    inventing a policy. Each row carries a probability. That probability is the odds
    you are willing to defend before the outcome is known.
sections:
  - heading: A routing table, with the odds left blank
    paragraphs:
      - Here is the shape, not a result. No odds are filled in, because those are yours.
    bullets:
      - "Buyer named, and a timeline named: the route may advance to a draft."
      - "Buyer missing, or timeline missing: the route holds, and the deal stays a topic for the pipeline review."
      - The odds column is empty until you write it. A blank is more honest than a number you borrowed from someone else's business.
  - heading: Who closes it
    paragraphs:
      - >
        A model may point at the row that matches. Matching is arithmetic. Closing
        the switch is the decision, and the owner makes it.
      - >
        If the rule lives in a prompt the team cannot open during the pipeline review,
        you do not have a switch. You have a habit with a fluent voice.
    bullets: []
caution: >
  The short circuit is letting the draft choose the route. The table was never
  written, so the forecast call cannot say which rule fired.
