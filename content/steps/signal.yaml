name: Signal
order: 1
status: published
accent: false
kicker: What comes in
line: A new lead arrives.
summary: >
  Signal means what comes in. Name it, or the meeting runs on memory.
lede:
  - Signal means what comes in.
  - >
    A reply. A form fill. A deal that has not moved. A buyer who went quiet.
    A request for a discount. That pile is the signal. It is not the decision.
sections:
  - heading: Write the list
    paragraphs:
      - >
        Write the signals that are allowed to change a route or a forecast.
        If a signal is not on the page, it still shows up. It shows up as a feeling.
      - The meeting gets shorter when the pile is a list. People argue the list.
    bullets: []
  - heading: What a model may do
    paragraphs:
      - >
        A model is a tool here, not the stage. It may list what arrived, with
        the source and the time, so the meeting starts from a page.
      - It does not say what to do next. That sentence is the switch.
    bullets: []
caution: >
  The short circuit here is acting because a new signal felt urgent. The note
  goes out before anyone has said which rule applied, or what the odds were.
nextHref: /method/switch
nextLabel: Switch
