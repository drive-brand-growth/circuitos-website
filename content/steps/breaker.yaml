name: Breaker
order: 4
status: published
accent: false
kicker: Written gates, a named yes
line: Written gates stop unearned work until a named person's recorded approval resets them.
summary: >
  Breaker means written gates, plus a named person's recorded approval,
  before anything reaches a customer or moves money.
lede:
  - Breaker means written gates, plus a named person's recorded approval, before anything goes out.
  - >
    A discount does not go out because a note was clean. A message to a live
    account does not go out because a queue was full. The gate is written.
    A named person approves, and that approval is recorded.
sections:
  - heading: What the receipt holds
    paragraphs:
      - >
        The rule that matched. The odds at the time. Who approved. What was
        released. If the next meeting cannot reconstruct that, the gate was a
        conversation, not a control.
    bullets: []
  - heading: A model does not approve itself
    paragraphs:
      - >
        A model may prepare the note and show the row that matched. It does not
        approve its own draft. A gate the model can open is not a breaker.
      - >
        Bookkeeping inside the team can move with a lighter look. The moment
        the work would reach a customer, or would change money, the gate is
        written and a named person records the approval.
    bullets: []
caution: >
  Skipping the gate is a short circuit. Speed is the usual reason. The missing
  receipt is how you notice it later.
nextHref: /method/ground
